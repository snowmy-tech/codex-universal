trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: azureServiceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: codex-universal-azure
  - name: acrName
    displayName: Azure Container Registry name (without azurecr.io)
    type: string
    default: k8scontainer
  - name: imageRepository
    displayName: Container image repository
    type: string
    default: codex-universal
  - name: armAgentPool
    displayName: ARM64 self-hosted Azure DevOps agent pool
    type: string
    default: codex-universal-arm64
  - name: pushImage
    displayName: Push image to Azure Container Registry
    type: boolean
    default: true

variables:
  imageTag: $(Build.SourceVersion)

stages:
  - stage: Validate
    displayName: Validate source
    jobs:
      - job: Validate
        displayName: Validate Docker and shell files
        pool:
          name: ${{ parameters.armAgentPool }}
          demands:
            - Agent.OS -equals Linux
            - Agent.OSArchitecture -equals ARM64
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - bash: |
              set -euo pipefail
              bash -n entrypoint.sh setup_universal.sh verify.sh
            displayName: Check shell syntax

          - bash: |
              set -euo pipefail
              docker run --rm -i hadolint/hadolint:v2.12.0-alpine \
                hadolint --failure-threshold error - < Dockerfile
            displayName: Lint Dockerfile on ARM64

  - stage: Build
    displayName: Build and publish image
    dependsOn: Validate
    condition: and(succeeded(), ${{ eq(parameters.pushImage, true) }}, ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildInAcr
        displayName: Build linux/arm64 image in ACR
        timeoutInMinutes: 180
        pool:
          name: ${{ parameters.armAgentPool }}
          demands:
            - Agent.OS -equals Linux
            - Agent.OSArchitecture -equals ARM64
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: AzureCLI@2
            displayName: Build and push immutable and branch tags
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                branch_tag="$(Build.SourceBranchName)"
                branch_tag="${branch_tag//[^A-Za-z0-9_.-]/-}"

                image_args=(
                  --image '${{ parameters.imageRepository }}:$(imageTag)'
                  --image '${{ parameters.imageRepository }}:'"${branch_tag}"
                )
                if [[ "$(Build.SourceBranch)" == "refs/heads/main" ]]; then
                  image_args+=(--image '${{ parameters.imageRepository }}:latest')
                fi

                az acr show --name '${{ parameters.acrName }}' --output none
                az acr build \
                  --registry '${{ parameters.acrName }}' \
                  --platform linux/arm64 \
                  "${image_args[@]}" \
                  --file Dockerfile \
                  .

          - bash: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              cat > "$(Build.ArtifactStagingDirectory)/image.txt" <<EOF
              ${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}:$(imageTag)
              EOF
            displayName: Record immutable image reference

          - publish: $(Build.ArtifactStagingDirectory)/image.txt
            artifact: container-image-reference
            displayName: Publish image reference
